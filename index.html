<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur Budget Erasmus+</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}.top{background:#fff;border-bottom:1px solid #dfe5ed;padding:24px}.top h1{margin:0;font-size:25px}.top p{margin:6px 0 0;color:#667085}.wrap{max-width:1100px;margin:auto;padding:24px}.tabs{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}.tabs button{border:0;border-radius:9px;padding:10px 14px;background:#eef2ff;color:#315efb;cursor:pointer}.tabs button.active{background:#315efb;color:#fff}.card{background:#fff;border:1px solid #dfe5ed;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:#667085}.field input,.field select{padding:10px;border:1px solid #dfe5ed;border-radius:8px;background:#f8fafc}.wide{grid-column:span 2}.full{grid-column:1/-1}.btn{border:0;border-radius:8px;padding:10px 15px;cursor:pointer}.primary{background:#315efb;color:#fff}.secondary{background:#eef2f6}.danger{background:#fff0ef;color:#b42318}.actions{text-align:right;margin-top:18px;display:flex;gap:8px;justify-content:flex-end}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid #dfe5ed;border-radius:14px;padding:18px}.stat small{color:#667085}.stat strong{display:block;font-size:25px;margin-top:7px}.lines{margin-top:10px}.line{display:flex;justify-content:space-between;border-bottom:1px solid #edf0f4;padding:10px 0}.line.total{font-size:18px;font-weight:bold;border-bottom:0}.notice{background:#eef2ff;border-radius:10px;padding:13px;color:#475467;font-size:13px;line-height:1.5}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #edf0f4}.table th{background:#f8fafc;color:#667085;font-size:12px}.right{text-align:right!important}.hidden{display:none}.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.rate h3{margin-top:0}.rate div{display:flex;justify-content:space-between;border-bottom:1px solid #edf0f4;padding:8px 0;font-size:13px}.footer{font-size:11px;color:#667085;line-height:1.5;margin-top:20px}@media(max-width:800px){.grid,.stats,.rates{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:550px){.grid,.stats,.rates{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body>
<header class="top">
<h1>Calculateur Budget Erasmus+</h1>
<p>Enseignement scolaire · KA122-SCH · barèmes 2025</p>
<div class="tabs">
<button id="tabDashboard" onclick="show('dashboard')">Tableau de bord</button>
<button id="tabNew" onclick="show('new')">Nouvelle mobilité</button>
<button id="tabList" onclick="show('list')">Mes mobilités</button>
<button id="tabRates" onclick="show('rates')">Barèmes 2025</button>
</div>
</header>
<main class="wrap">
<section id="dashboard"></section>
<section id="new" class="hidden"></section>
<section id="list" class="hidden"></section>
<section id="rates" class="hidden"></section>
</main>
<script>
const STORAGE='erasmusBudgetKA122SCH2025';
const R={
travel:[
{max:99,eco:56,normal:28,label:'10–99 km'},
{max:499,eco:285,normal:211,label:'100–499 km'},
{max:1999,eco:417,normal:309,label:'500–1 999 km'},
{max:2999,eco:535,normal:395,label:'2 000–2 999 km'},
{max:3999,eco:785,normal:580,label:'3 000–3 999 km'},
{max:7999,eco:1188,normal:1188,label:'4 000–7 999 km'},
{max:Infinity,eco:1735,normal:1735,label:'8 000 km ou plus'}],
staff:[150,133,116],student:[55,48,41],
orgGroup:100,orgShortFirst:350,orgShortExtra:200,orgLong:500,orgStaffFirst:350,orgStaffExtra:200,
course:80,inclusionOrg:125,prep:680,language:150,languageLongExtra:150
};
let mobs=JSON.parse(localStorage.getItem(STORAGE)||'[]');let editing=-1;
const euro=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
function save(){localStorage.setItem(STORAGE,JSON.stringify(mobs))}
function travelRate(km,eco){let r=R.travel.find(x=>km<=x.max);return r?(eco?r.eco:r.normal):0}
function stayDays(days){return days<=14?days:14+(days-14)*.7}
function orgAmount(type,n){n=Math.max(0,+n||0);if(type==='group')return n*100;if(type==='short'||type==='staffObs'||type==='staffTeach')return Math.min(n,100)*350+Math.max(0,n-100)*200;if(type==='long')return n*500;return 0}
function calc(x){
let n=+x.participants||0,a=+x.accomp||0,days=+x.days||0,td=+x.travelDays||0,people=n+a;
let tr=travelRate(+x.distance||0,x.eco==='yes');let travel=people*tr;
let group=+x.countryGroup||1;let studentRate=R.student[group-1],staffRate=R.staff[group-1];
let stay=n*studentRate*stayDays(days)+a*staffRate*stayDays(days);
let org=orgAmount(x.activity,n);
let fewer=Math.min(n,+x.fewer||0);let inclusionOrg=fewer*R.inclusionOrg;
let prep=Math.min(3,+x.prep||0)*R.prep;
let registration=x.activity==='staffTeach'||x.registration==='yes'?n*Math.min((+x.courseDays||0)*R.course,800):0;
let language=0;if(['short','long','staffObs','staffTeach'].includes(x.activity))language=(+x.language||0)*R.language;if(x.activity==='long')language+=(+x.languageLong||0)*R.languageLongExtra;
let realInclusion=+x.realInclusion||0,exceptional=+x.exceptional||0;
let total=travel+stay+org+inclusionOrg+prep+registration+language+realInclusion+exceptional;
return{travel,stay,org,inclusionOrg,prep,registration,language,realInclusion,exceptional,total,travelRate:tr,studentRate,staffRate};}
function show(id){['dashboard','new','list','rates'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));['dashboard','new','list','rates'].forEach(x=>document.getElementById('tab'+({dashboard:'Dashboard',new:'New',list:'List',rates:'Rates'}[x])).classList.toggle('active',x===id));if(id==='dashboard')dashboard();if(id==='new')form();if(id==='list')list();if(id==='rates')rates()}
function dashboard(){let total=mobs.reduce((s,x)=>s+calc(x).total,0),p=mobs.reduce((s,x)=>s+(+x.participants||0),0);document.getElementById('dashboard').innerHTML=`<div class="stats"><div class="stat"><small>Budget estimé</small><strong>${euro(total)}</strong></div><div class="stat"><small>Mobilités</small><strong>${mobs.length}</strong></div><div class="stat"><small>Participants</small><strong>${p}</strong></div><div class="stat"><small>Transport vert</small><strong>${mobs.filter(x=>x.eco==='yes').length}</strong></div></div><div class="card"><h2>Bienvenue</h2><p>Ajoutez vos mobilités pour obtenir automatiquement une estimation du budget Erasmus+.</p><div class="actions"><button class="btn primary" onclick="show('new')">+ Nouvelle mobilité</button></div></div><div class="card"><h2>Budget par catégorie</h2>${breakdown()}</div><div class="footer">Barèmes : Annexe III – Taux applicables – KA122 SCH 2025.</div>`}
function breakdown(){let z={travel:0,stay:0,org:0,other:0};mobs.forEach(x=>{let c=calc(x);z.travel+=c.travel;z.stay+=c.stay;z.org+=c.org+c.inclusionOrg;z.other+=c.prep+c.registration+c.language+c.realInclusion+c.exceptional});return `<div class="lines"><div class="line"><span>Voyage</span><b>${euro(z.travel)}</b></div><div class="line"><span>Séjour</span><b>${euro(z.stay)}</b></div><div class="line"><span>Organisation + inclusion</span><b>${euro(z.org)}</b></div><div class="line"><span>Autres</span><b>${euro(z.other)}</b></div><div class="line total"><span>Total</span><b>${euro(z.travel+z.stay+z.org+z.other)}</b></div></div>`}
function form(){let x=editing>=0?mobs[editing]:{};document.getElementById('new').innerHTML=`<div class="card"><h2>${editing>=0?'Modifier la mobilité':'Nouvelle mobilité'}</h2><div class="grid">
<div class="field wide"><label>Nom de la mobilité</label><input id="name" value="${esc(x.name||'')}" placeholder="Ex. Mobilité Espagne – avril"></div><div class="field"><label>Destination</label><input id="dest" value="${esc(x.dest||'')}" placeholder="Espagne"></div><div class="field"><label>Type</label><select id="kind"><option value="student" ${x.kind!=='staff'?'selected':''}>Élèves</option><option value="staff" ${x.kind==='staff'?'selected':''}>Personnel</option></select></div>
<div class="field wide"><label>Type d'activité</label><select id="activity"><option value="group" ${x.activity==='group'?'selected':''}>Mobilité de groupe d'élèves</option><option value="short" ${x.activity==='short'?'selected':''}>Mobilité d'apprentissage de courte durée – élèves</option><option value="long" ${x.activity==='long'?'selected':''}>Mobilité d'apprentissage de longue durée – élèves</option><option value="staffObs" ${x.activity==='staffObs'?'selected':''}>Personnel – observation au poste de travail</option><option value="staffTeach" ${x.activity==='staffTeach'?'selected':''}>Personnel – enseignement / formation</option></select></div>
<div class="field"><label>Participants</label><input id="participants" type="number" min="0" value="${x.participants??1}"></div><div class="field"><label>Accompagnateurs</label><input id="accomp" type="number" min="0" value="${x.accomp??0}"></div><div class="field"><label>Durée de l'activité (jours)</label><input id="days" type="number" min="1" value="${x.days??5}"></div><div class="field"><label>Jours de voyage</label><input id="travelDays" type="number" min="0" value="${x.travelDays??2}"></div>
<div class="field"><label>Distance parcourue (km)</label><input id="distance" type="number" min="10" value="${x.distance??800}"></div><div class="field"><label>Voyage</label><select id="eco"><option value="yes" ${x.eco!=='no'?'selected':''}>Écoresponsable</option><option value="no" ${x.eco==='no'?'selected':''}>Non écoresponsable</option></select></div><div class="field wide"><label>Groupe de pays d'accueil</label><select id="countryGroup"><option value="1" ${x.countryGroup==1?'selected':''}>Groupe 1 – 150 € personnel / 55 € élèves</option><option value="2" ${x.countryGroup!=1&&x.countryGroup!=3?'selected':''}>Groupe 2 – 133 € personnel / 48 € élèves</option><option value="3" ${x.countryGroup==3?'selected':''}>Groupe 3 – 116 € personnel / 41 € élèves</option></select></div>
<div class="field"><label>Participants ayant moins d'opportunités</label><input id="fewer" type="number" min="0" value="${x.fewer??0}"></div><div class="field"><label>Visite préparatoire</label><input id="prep" type="number" min="0" max="3" value="${x.prep??0}"></div><div class="field"><label>Jours de frais d'inscription</label><input id="courseDays" type="number" min="0" value="${x.courseDays??0}"></div><div class="field"><label>Frais d'inscription</label><select id="registration"><option value="no" ${x.registration!=='yes'?'selected':''}>Non</option><option value="yes" ${x.registration==='yes'?'selected':''}>Oui</option></select></div>
<div class="field"><label>Soutien linguistique</label><input id="language" type="number" min="0" value="${x.language??0}"></div><div class="field"><label>Longue durée – soutien renforcé</label><input id="languageLong" type="number" min="0" value="${x.languageLong??0}"></div><div class="field"><label>Inclusion – coûts réels (€)</label><input id="realInclusion" type="number" min="0" value="${x.realInclusion??0}"></div><div class="field"><label>Coûts exceptionnels (€)</label><input id="exceptional" type="number" min="0" value="${x.exceptional??0}"></div></div><div id="preview" class="card" style="margin:18px 0 0;background:#f8fafc"></div><div class="actions"><button class="btn secondary" onclick="editing=-1;show('dashboard')">Annuler</button><button class="btn primary" onclick="saveForm()">Enregistrer</button></div></div><div class="notice"><b>Important :</b> la distance est la distance entre le lieu d'origine et le lieu de l'activité. Le forfait voyage couvre l'aller-retour. Les taux de séjour sont réduits à 70 % à partir du 15e jour.</div>`;document.querySelectorAll('#new input,#new select').forEach(e=>e.addEventListener('input',preview));preview()}
function val(id){return document.getElementById(id).value}
function formData(){return{name:val('name'),dest:val('dest'),kind:val('kind'),activity:val('activity'),participants:+val('participants'),accomp:+val('accomp'),days:+val('days'),travelDays:+val('travelDays'),distance:+val('distance'),eco:val('eco'),countryGroup:+val('countryGroup'),fewer:+val('fewer'),prep:+val('prep'),courseDays:+val('courseDays'),registration:val('registration'),language:+val('language'),languageLong:+val('languageLong'),realInclusion:+val('realInclusion'),exceptional:+val('exceptional')}}
function preview(){let c=calc(formData());document.getElementById('preview').innerHTML=`<h3>Estimation</h3><div class="lines"><div class="line"><span>Voyage – ${euro(c.travelRate)} / personne</span><b>${euro(c.travel)}</b></div><div class="line"><span>Séjour</span><b>${euro(c.stay)}</b></div><div class="line"><span>Organisation</span><b>${euro(c.org)}</b></div><div class="line"><span>Inclusion organisation</span><b>${euro(c.inclusionOrg)}</b></div><div class="line"><span>Visite préparatoire</span><b>${euro(c.prep)}</b></div><div class="line"><span>Autres postes</span><b>${euro(c.registration+c.language+c.realInclusion+c.exceptional)}</b></div><div class="line total"><span>TOTAL</span><b>${euro(c.total)}</b></div></div>`}
function saveForm(){let x=formData();if(!x.name.trim()){alert('Veuillez donner un nom à la mobilité.');return}if(editing>=0)mobs[editing]=x;else mobs.push(x);save();editing=-1;show('list')}
function list(){document.getElementById('list').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>Mes mobilités</h2><button class="btn primary" onclick="editing=-1;show('new')">+ Nouvelle</button></div>${mobs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Mobilité</th><th>Destination</th><th>Type</th><th>Participants</th><th>Durée</th><th class="right">Budget</th><th></th></tr></thead><tbody>${mobs.map((x,i)=>{let c=calc(x);return `<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.dest)}</td><td>${x.kind==='staff'?'Personnel':'Élèves'}</td><td>${x.participants} + ${x.accomp} acc.</td><td>${x.days} j.</td><td class="right"><b>${euro(c.total)}</b></td><td class="right"><button class="btn secondary" onclick="editing=${i};show('new')">Modifier</button> <button class="btn danger" onclick="delMob(${i})">Supprimer</button></td></tr>`}).join('')}</tbody></table></div>`:'<p>Aucune mobilité enregistrée.</p>'}</div>`}
function delMob(i){if(confirm('Supprimer cette mobilité ?')){mobs.splice(i,1);save();list()}}
function rates(){document.getElementById('rates').innerHTML=`<div class="card"><h2>Barèmes officiels – KA122-SCH 2025</h2><div class="notice">Ces valeurs correspondent à l'Annexe III – Taux applicables – KA122 SCH 2025.</div></div><div class="rates"><div class="card rate"><h3>Voyage</h3>${R.travel.map(x=>`<div><span>${x.label}</span><b>${x.eco} € / ${x.normal} €</b></div>`).join('')}<p style="font-size:11px;color:#667085">Ordre : écoresponsable / non écoresponsable.</p></div><div class="card rate"><h3>Séjour – élèves</h3><div><span>Groupe 1</span><b>55 €/jour</b></div><div><span>Groupe 2</span><b>48 €/jour</b></div><div><span>Groupe 3</span><b>41 €/jour</b></div><h3>Séjour – personnel / accompagnateurs</h3><div><span>Groupe 1</span><b>150 €/jour</b></div><div><span>Groupe 2</span><b>133 €/jour</b></div><div><span>Groupe 3</span><b>116 €/jour</b></div></div><div class="card rate"><h3>Organisation</h3><div><span>Groupe élèves</span><b>100 €/élève</b></div><div><span>Cours / formations personnel</span><b>100 €/participant</b></div><div><span>Expert invité</span><b>100 €/participant</b></div><div><span>Éducateur accueilli</span><b>100 €/participant</b></div><div><span>Courte durée élèves</span><b>350 € puis 200 € au-delà de 100</b></div><div><span>Observation personnel</span><b>350 € puis 200 € au-delà de 100</b></div><div><span>Enseignement / formation</span><b>350 € puis 200 € au-delà de 100</b></div><div><span>Longue durée élèves</span><b>500 €/participant</b></div></div></div><div class="rates"><div class="card rate"><h3>Autres forfaits</h3><div><span>Frais d'inscription</span><b>80 €/jour, max 800 €</b></div><div><span>Inclusion organismes</span><b>125 €/participant</b></div><div><span>Visite préparatoire</span><b>680 €, max 3</b></div></div><div class="card rate"><h3>Soutien linguistique</h3><div><span>Éligible</span><b>150 €/participant</b></div><div><span>Longue durée – renforcé</span><b>+150 €/participant</b></div></div><div class="card rate"><h3>Séjour</h3><div><span>Jusqu'au 14e jour</span><b>100 %</b></div><div><span>À partir du 15e</span><b>70 %</b></div><p style="font-size:11px;color:#667085">Les taux de séjour sont arrondis à l'euro le plus proche. Les taux du personnel s'appliquent aux accompagnateurs.</p></div></div><div class="footer">Source : Annexe III – Taux applicables – KA122 SCH 2025.</div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
show('dashboard');
</script>
</body>
</html>
