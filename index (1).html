<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculateur Budget Erasmus+</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color-scheme:light dark;--bg:light-dark(#f5f7fb,#10151d);--surface:light-dark(#fff,#171e28);--surface2:light-dark(#f7f9fc,#1d2632);--text:light-dark(#172033,#eef3f8);--muted:light-dark(#667085,#aab6c5);--border:light-dark(#dfe5ed,#303b4b);--accent:light-dark(#315efb,#6f8cff);--accent2:light-dark(#e9efff,#202d57);--green:light-dark(#087443,#43c98b);--danger:light-dark(#b42318,#ff8d85);}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}#app{min-height:100vh;background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}.top{padding:24px 28px 18px;border-bottom:1px solid var(--border);background:var(--surface)}.brand{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand h1{margin:0;font-size:24px}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}.badge{padding:7px 10px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:12px}.nav{display:flex;gap:8px;margin-top:20px;overflow:auto}.nav button{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:9px;white-space:nowrap}.nav button.active{background:var(--accent2);color:var(--accent);font-weight:700}.wrap{max-width:1180px;margin:auto;padding:24px}.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:27px;font-weight:750;margin-top:7px}.metric .sub{font-size:12px;color:var(--muted);margin-top:5px}.section-title{display:flex;justify-content:space-between;align-items:end;margin:28px 0 12px}.section-title h2{font-size:17px;margin:0}.section-title span{font-size:12px;color:var(--muted)}.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px;color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--accent)}.span2{grid-column:span 2}.span4{grid-column:1/-1}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:10px 14px;border-radius:9px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.btn.danger{color:var(--danger)}.budget-preview{margin-top:18px;display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.lines{display:flex;flex-direction:column;gap:8px}.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}.line:last-child{border-bottom:0;font-weight:750;font-size:15px}.notice{background:var(--accent2);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--border));padding:12px 14px;border-radius:10px;color:var(--muted);font-size:12px;line-height:1.45}.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}.table th{background:var(--surface2);color:var(--muted);font-weight:600}.table tr:last-child td{border-bottom:0}.right{text-align:right!important}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--accent2);color:var(--accent);font-size:11px}.empty{text-align:center;padding:35px;color:var(--muted)}.bar-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.bar-group h3{font-size:14px;margin:0 0 9px}.bar-item{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}.footer{margin-top:24px;color:var(--muted);font-size:11px;line-height:1.5}.hidden{display:none!important}@media(max-width:850px){.cards,.formgrid,.bar-grid,.budget-preview{grid-template-columns:1fr 1fr}.span2{grid-column:span 2}}@media(max-width:600px){.wrap{padding:16px}.top{padding:18px 16px}.cards,.formgrid,.bar-grid,.budget-preview{grid-template-columns:1fr}.span2{grid-column:auto}.brand{align-items:flex-start;flex-direction:column}.nav{margin-top:14px}}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="brand"><div><h1>Calculateur Budget Erasmus+</h1><p>Enseignement scolaire · estimation des financements 2026</p></div><div class="badge">Collège Henri Barnier · 2026–2027</div></div><nav class="nav" id="nav"></nav></header>
<main class="wrap">
<section id="dashboard" class="view"></section>
<section id="new" class="view hidden"></section>
<section id="mobilities" class="view hidden"></section>
<section id="rates" class="view hidden"></section>
</main>
</div>
<script>
const KEY='erasmus-budget-hb-v1';
const official={travel:[{min:10,max:99,green:56,standard:28},{min:100,max:499,green:285,standard:211},{min:500,max:1999,green:417,standard:309},{min:2000,max:2999,green:535,standard:395},{min:3000,max:3999,green:785,standard:580},{min:4000,max:7999,green:1188,standard:1188},{min:8000,max:Infinity,green:1735,standard:1735}],org:{group:100,short:350,long:500,staffCourse:100,staffJob:350},inclusionOrg:125,prep:680,course:80,language:150};
let rates=JSON.parse(localStorage.getItem(KEY+'_rates')||'null')||{studentG1:65,studentG2:57,studentG3:50,staffG1:150,staffG2:132,staffG3:116};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||[];
let current=null, currentTab='dashboard';
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(KEY+'_rates',JSON.stringify(rates));}
function travelRate(km,green){let r=official.travel.find(x=>km>=x.min&&km<=x.max);return r?(green?r.green:r.standard):0}
function groupOptions(){return '<option value="1">Groupe 1 — France, Espagne? non : Allemagne, Italie, Belgique…</option><option value="2">Groupe 2 — Espagne, Portugal, Grèce…</option><option value="3">Groupe 3 — Pologne, Croatie, Roumanie…</option>'}
function supportRate(type,group){return Number(rates[(type==='student'?'student':'staff')+'G'+group])||0}
function calc(x){
 const participants=Number(x.participants)||0, acc=Number(x.accomp)||0, persons=participants+acc, days=Number(x.days)||0, travelDays=Number(x.travelDays)||0, fundedDays=days+travelDays;
 const tr=travelRate(Number(x.km)||0,x.green==='yes');
 const travel=persons*tr;
 const studentCount=x.type==='student'?participants:0, staffCount=x.type==='staff'?participants:0;
 const studentSupport=studentCount*supportRate('student',x.group)*(fundedDays<=14?fundedDays:(14+(fundedDays-14)*0.7));
 const staffSupport=staffCount*supportRate('staff',x.group)*(fundedDays<=14?fundedDays:(14+(fundedDays-14)*0.7));
 const accSupport=acc*supportRate('staff',x.group)*(fundedDays<=14?fundedDays:(14+(fundedDays-14)*0.7));
 let orgRate=x.activity==='group'?official.org.group:x.activity==='short'?official.org.short:x.activity==='long'?official.org.long:official.org.staffCourse;
 if(x.type==='staff') orgRate=x.activity==='course'?official.org.staffCourse:official.org.staffJob;
 const org=participants*orgRate;
 const inclusionOrg=(Number(x.fewer)||0)*official.inclusionOrg;
 const prep=(Number(x.prep)||0)*official.prep;
 const course=(Number(x.courseDays)||0)*official.course*staffCount;
 const language=(Number(x.language)||0)*official.language;
 const inclusionReal=Number(x.inclusionReal)||0, exceptional=Number(x.exceptional)||0;
 const total=travel+studentSupport+staffSupport+accSupport+org+inclusionOrg+prep+course+language+inclusionReal+exceptional;
 return {travel,studentSupport,staffSupport,accSupport,org,inclusionOrg,prep,course,language,inclusionReal,exceptional,total,fundedDays,travelRate:tr};
}
function nav(){const items=[['dashboard','Tableau de bord'],['new','Nouvelle mobilité'],['mobilities','Mes mobilités'],['rates','Barèmes']];document.getElementById('nav').innerHTML=items.map(([id,t])=>`<button class="${currentTab===id?'active':''}" onclick="show('${id}')">${t}</button>`).join('')}
function show(id){currentTab=id;['dashboard','new','mobilities','rates'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));nav();({dashboard:renderDashboard,new:renderNew,mobilities:renderMobilities,rates:renderRates}[id])()}
function renderDashboard(){const total=data.reduce((s,x)=>s+calc(x).total,0), participants=data.reduce((s,x)=>s+Number(x.participants||0),0), mobs=data.length, green=data.filter(x=>x.green==='yes').length;document.getElementById('dashboard').innerHTML=`<div class="grid cards"><div class="card metric"><div class="label">Budget estimé</div><div class="value">${eur(total)}</div><div class="sub">toutes mobilités</div></div><div class="card metric"><div class="label">Mobilités</div><div class="value">${mobs}</div><div class="sub">enregistrées</div></div><div class="card metric"><div class="label">Participants</div><div class="value">${participants}</div><div class="sub">hors accompagnateurs</div></div><div class="card metric"><div class="label">Mobilités vertes</div><div class="value">${green}</div><div class="sub">transport écoresponsable</div></div></div><div class="section-title"><h2>Répartition du budget</h2><span>calculée automatiquement</span></div><div class="panel">${renderBreakdown()}</div><div class="section-title"><h2>Dernières mobilités</h2><button class="btn primary" onclick="show('new')">+ Ajouter</button></div><div class="panel">${renderMiniTable()}</div><div class="footer">Les montants unitaires de voyage, organisation, inclusion, visites préparatoires, frais de cours et soutien linguistique sont paramétrés d’après le Guide Erasmus+ 2026 pour l’enseignement scolaire. Les taux journaliers de soutien individuel sont volontairement modifiables car l’Agence nationale fixe le montant exact dans la fourchette autorisée.</div>`}
function renderBreakdown(){const sums={travel:0,support:0,org:0,other:0};data.forEach(x=>{let c=calc(x);sums.travel+=c.travel;sums.support+=c.studentSupport+c.staffSupport+c.accSupport;sums.org+=c.org+c.inclusionOrg;sums.other+=c.prep+c.course+c.language+c.inclusionReal+c.exceptional});return `<div class="lines"><div class="line"><span>Voyage</span><strong>${eur(sums.travel)}</strong></div><div class="line"><span>Frais de séjour / soutien individuel</span><strong>${eur(sums.support)}</strong></div><div class="line"><span>Organisation + inclusion organisation</span><strong>${eur(sums.org)}</strong></div><div class="line"><span>Autres postes</span><strong>${eur(sums.other)}</strong></div><div class="line"><span>Total</span><strong>${eur(sums.travel+sums.support+sums.org+sums.other)}</strong></div></div>`}
function renderMiniTable(){if(!data.length)return '<div class="empty">Aucune mobilité enregistrée. Commence par créer une mobilité.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Mobilité</th><th>Destination</th><th>Participants</th><th>Type</th><th class="right">Budget</th></tr></thead><tbody>${data.slice(-5).reverse().map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${esc(x.destination)}</td><td>${x.participants}</td><td><span class="pill">${x.type==='student'?'Élèves':'Personnel'}</span></td><td class="right"><strong>${eur(calc(x).total)}</strong></td></tr>`).join('')}</tbody></table></div>`}
function formFields(x={}){return `<div class="formgrid"><div class="field span2"><label>Nom de la mobilité</label><input id="f_name" value="${esc(x.name||'Mobilité Espagne')}" placeholder="Ex. Groupe Espagne – avril 2027"></div><div class="field"><label>Destination</label><input id="f_dest" value="${esc(x.destination||'Espagne')}" placeholder="Pays"></div><div class="field"><label>Type de participants</label><select id="f_type" onchange="refreshForm()"><option value="student" ${(x.type||'student')==='student'?'selected':''}>Élèves</option><option value="staff" ${x.type==='staff'?'selected':''}>Personnel</option></select></div><div class="field"><label>Activité</label><select id="f_activity"><option value="group" ${(!x.activity||x.activity==='group')?'selected':''}>Mobilité de groupe élèves</option><option value="short" ${x.activity==='short'?'selected':''}>Élève — courte durée</option><option value="long" ${x.activity==='long'?'selected':''}>Élève — longue durée</option><option value="job" ${x.activity==='job'?'selected':''}>Personnel — observation / enseignement</option><option value="course" ${x.activity==='course'?'selected':''}>Personnel — cours / formation</option></select></div><div class="field"><label>Nombre de participants</label><input id="f_participants" type="number" min="0" value="${x.participants??20}" oninput="previewCalc()"></div><div class="field"><label>Accompagnateurs</label><input id="f_accomp" type="number" min="0" value="${x.accomp??2}" oninput="previewCalc()"></div><div class="field"><label>Durée de mobilité (jours)</label><input id="f_days" type="number" min="1" value="${x.days??5}" oninput="previewCalc()"></div><div class="field"><label>Jours de voyage financés</label><input id="f_travelDays" type="number" min="0" max="6" value="${x.travelDays??2}" oninput="previewCalc()"></div><div class="field"><label>Distance aller simple (km)</label><input id="f_km" type="number" min="0" value="${x.km??800}" oninput="previewCalc()"></div><div class="field"><label>Transport</label><select id="f_green" onchange="previewCalc()"><option value="yes" ${(x.green||'yes')==='yes'?'selected':''}>Écoresponsable</option><option value="no" ${x.green==='no'?'selected':''}>Non écoresponsable</option></select></div><div class="field"><label>Groupe de pays d’accueil</label><select id="f_group">${groupOptions().replace(`value="${x.group||2}"`,`value="${x.group||2}" selected`)}</select></div><div class="field"><label>Participants avec moins d’opportunités</label><input id="f_fewer" type="number" min="0" value="${x.fewer??0}" oninput="previewCalc()"></div><div class="field"><label>Visite préparatoire (participants)</label><input id="f_prep" type="number" min="0" value="${x.prep??0}" oninput="previewCalc()"></div><div class="field"><label>Jours de cours/formation payants</label><input id="f_courseDays" type="number" min="0" value="${x.courseDays??0}" oninput="previewCalc()"></div><div class="field"><label>Soutien linguistique (participants)</label><input id="f_language" type="number" min="0" value="${x.language??0}" oninput="previewCalc()"></div><div class="field"><label>Inclusion — coûts réels (€)</label><input id="f_inclusionReal" type="number" min="0" value="${x.inclusionReal??0}" oninput="previewCalc()"></div><div class="field"><label>Coûts exceptionnels (€)</label><input id="f_exceptional" type="number" min="0" value="${x.exceptional??0}" oninput="previewCalc()"></div></div>`}
function getForm(){const g=id=>document.getElementById(id);return {name:g('f_name').value,destination:g('f_dest').value,type:g('f_type').value,activity:g('f_activity').value,participants:+g('f_participants').value,accomp:+g('f_accomp').value,days:+g('f_days').value,travelDays:+g('f_travelDays').value,km:+g('f_km').value,green:g('f_green').value,group:+g('f_group').value,fewer:+g('f_fewer').value,prep:+g('f_prep').value,courseDays:+g('f_courseDays').value,language:+g('f_language').value,inclusionReal:+g('f_inclusionReal').value,exceptional:+g('f_exceptional').value}}
function renderNew(){document.getElementById('new').innerHTML=`<div class="section-title"><h2>${current?'Modifier la mobilité':'Créer une mobilité'}</h2><span>les calculs se mettent à jour automatiquement</span></div><div class="panel">${formFields(current||{})}<div id="preview" class="budget-preview"></div><div class="actions"><button class="btn" onclick="show('dashboard')">Annuler</button><button class="btn primary" onclick="saveForm()">${current?'Enregistrer les modifications':'Ajouter la mobilité'}</button></div></div><div class="section-title"><h2>Règles intégrées</h2></div><div class="notice">Le calcul utilise les forfaits Erasmus+ 2026 de l’enseignement scolaire : voyage selon distance et transport, organisation, inclusion organisation, visites préparatoires, frais d’inscription et soutien linguistique. Le soutien individuel utilise les taux de travail définis dans l’onglet <b>Barèmes</b>, car le guide européen donne une fourchette et l’Agence nationale fixe le taux exact.</div>`;previewCalc()}
function refreshForm(){previewCalc()}
function previewCalc(){if(!document.getElementById('f_name'))return;const c=calc(getForm());document.getElementById('preview').innerHTML=`<div class="panel" style="padding:15px"><div class="section-title" style="margin:0 0 8px"><h2>Estimation</h2><span>${c.fundedDays} jours financés</span></div><div class="lines"><div class="line"><span>Voyage</span><strong>${eur(c.travel)}</strong></div><div class="line"><span>Soutien individuel + accompagnateurs</span><strong>${eur(c.studentSupport+c.staffSupport+c.accSupport)}</strong></div><div class="line"><span>Organisation</span><strong>${eur(c.org)}</strong></div><div class="line"><span>Inclusion organisation</span><strong>${eur(c.inclusionOrg)}</strong></div><div class="line"><span>Autres postes</span><strong>${eur(c.prep+c.course+c.language+c.inclusionReal+c.exceptional)}</strong></div><div class="line"><span>TOTAL ESTIMÉ</span><strong>${eur(c.total)}</strong></div></div></div><div class="notice"><b>Forfait voyage appliqué :</b> ${eur(c.travelRate)} / personne · ${getForm().green==='yes'?'écoresponsable':'standard'}.<br><br>Les jours financés = durée de mobilité + jours de voyage saisis. À partir du 15e jour, le soutien individuel est calculé à 70 % du taux de base.</div>`}
function saveForm(){const x=getForm();if(!x.name.trim()){alert('Donne un nom à la mobilité.');return}if(current){Object.assign(current,x);current=null}else data.push(x);save();show('mobilities')}
function renderMobilities(){document.getElementById('mobilities').innerHTML=`<div class="section-title"><h2>Mes mobilités</h2><div><button class="btn" onclick="exportCSV()">Exporter CSV</button> <button class="btn primary" onclick="show('new')">+ Nouvelle mobilité</button></div></div><div class="panel">${data.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Mobilité</th><th>Destination</th><th>Type</th><th>Participants</th><th>Durée</th><th class="right">Budget</th><th></th></tr></thead><tbody>${data.map((x,i)=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.destination)}</td><td>${x.type==='student'?'Élèves':'Personnel'}</td><td>${x.participants} + ${x.accomp} acc.</td><td>${x.days} j.</td><td class="right"><strong>${eur(calc(x).total)}</strong></td><td class="right"><button class="btn" onclick="editMob(${i})">Modifier</button> <button class="btn danger" onclick="deleteMob(${i})">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aucune mobilité enregistrée.</div>'}</div>`}
function editMob(i){current=data[i];show('new')}
function deleteMob(i){if(confirm('Supprimer cette mobilité ?')){data.splice(i,1);save();renderMobilities();}}
function exportCSV(){let rows=[['Mobilité','Destination','Type','Participants','Accompagnateurs','Durée','Budget estimé']];data.forEach(x=>rows.push([x.name,x.destination,x.type,x.participants,x.accomp,x.days,Math.round(calc(x).total)]));const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='budget-erasmus-2026-2027.csv';a.click();}
function renderRates(){document.getElementById('rates').innerHTML=`<div class="section-title"><h2>Barèmes</h2><span>paramètres modifiables</span></div><div class="panel"><div class="notice">Les forfaits ci-dessous sont basés sur le Guide du programme Erasmus+ 2026 — enseignement scolaire. Les taux de soutien individuel sont des <b>taux de travail</b> : le guide fixe des fourchettes et l’Agence nationale détermine le taux exact. Tu peux donc les modifier sans toucher aux autres forfaits.</div><div class="section-title"><h2>Soutien individuel — taux de travail / jour</h2></div><div class="formgrid"><div class="field"><label>Élève · groupe 1</label><input id="r_s1" type="number" value="${rates.studentG1}"></div><div class="field"><label>Élève · groupe 2</label><input id="r_s2" type="number" value="${rates.studentG2}"></div><div class="field"><label>Élève · groupe 3</label><input id="r_s3" type="number" value="${rates.studentG3}"></div><div class="field"><label>Personnel · groupe 1</label><input id="r_t1" type="number" value="${rates.staffG1}"></div><div class="field"><label>Personnel · groupe 2</label><input id="r_t2" type="number" value="${rates.staffG2}"></div><div class="field"><label>Personnel · groupe 3</label><input id="r_t3" type="number" value="${rates.staffG3}"></div></div><div class="actions"><button class="btn primary" onclick="saveRates()">Enregistrer les barèmes</button></div></div><div class="section-title"><h2>Forfaits officiels intégrés</h2></div><div class="panel"><div class="bar-grid"><div class="bar-group"><h3>Voyage</h3>${official.travel.map(x=>`<div class="bar-item"><span>${x.min}–${x.max===Infinity?'∞':x.max} km</span><b>${x.green} € / ${x.standard} €</b></div>`).join('')}</div><div class="bar-group"><h3>Organisation</h3><div class="bar-item"><span>Groupe élèves</span><b>100 €</b></div><div class="bar-item"><span>Élève courte durée / personnel observation</span><b>350 €</b></div><div class="bar-item"><span>Élève longue durée</span><b>500 €</b></div><div class="bar-item"><span>Cours / formation personnel</span><b>100 €</b></div></div><div class="bar-group"><h3>Autres</h3><div class="bar-item"><span>Inclusion organisation</span><b>125 €</b></div><div class="bar-item"><span>Visite préparatoire</span><b>680 €</b></div><div class="bar-item"><span>Frais d’inscription</span><b>80 €/jour</b></div><div class="bar-item"><span>Soutien linguistique</span><b>150 €</b></div></div></div></div><div class="footer">Référence : Guide du programme Erasmus+ 2026, section « Mobilité des élèves et du personnel de l’enseignement scolaire ». Vérifier les taux nationaux et la convention de subvention avant utilisation comptable.</div>`}
function saveRates(){rates={studentG1:+document.getElementById('r_s1').value,studentG2:+document.getElementById('r_s2').value,studentG3:+document.getElementById('r_s3').value,staffG1:+document.getElementById('r_t1').value,staffG2:+document.getElementById('r_t2').value,staffG3:+document.getElementById('r_t3').value};save();alert('Barèmes enregistrés.');show('rates')}
nav();show('dashboard');
</script>
</body>
</html>
